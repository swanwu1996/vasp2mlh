name: hamgnn-gpu
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - --find-links https://data.pyg.org/whl/torch-2.8.0+cu128.html
      - setuptools==79.0.1
      - torch==2.8.0
      - torch-geometric==2.6.1
      - torch-scatter==2.1.2+pt28cu128
      - torch-sparse==0.6.18+pt28cu128
      - e3nn==0.6.0
      - lightning==2.5.6
      - pymatgen==2025.10.7
      - numpy==2.2.6
      - scipy==1.15.3
      - easydict==1.14
      - scikit-learn==1.7.2
      - torch-runstats==0.2.0
      - torch-ema==0.3
      - HamGNN @ git+https://github.com/QuantumLab-ZY/HamGNN.git@64dba1dbf445ccfa2683f560059c3fbca0df624a
      - vasp2mlh @ git+https://github.com/swanwu1996/vasp2mlh.git@v0.4.0
variables:
  PYTHONNOUSERSITE: '1'
