[build-system]
requires = ["setuptools>=68", "Cython>=3"]
build-backend = "setuptools.build_meta"

[project]
name = "vasp2mlh"
version = "0.6.2"
description = "PAW-metric projection of VASP wavefunctions onto numerical atomic orbitals"
readme = {text = "Middleware for constructing and validating sparse local-orbital Hamiltonian and overlap matrices from VASP PAW wavefunctions.", content-type = "text/plain"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.15", "h5py>=3.8", "ase>=3.22", "threadpoolctl>=3", "tqdm>=4.66,<5", "tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
pyg = ["torch", "torch-geometric"]

[project.scripts]
v2h = "vasp2mlh.cli:main"
v2h_valid = "vasp2mlh.cli:valid_main"
v2h_genbasis = "vasp2mlh.cli:genbasis_main"

[tool.setuptools]
package-dir = {"" = "assets"}
packages = ["vasp2mlh"]

[tool.setuptools.package-data]
vasp2mlh = ["viewer.html", "compact-defaults-v1.toml", "_radial.pyx"]
