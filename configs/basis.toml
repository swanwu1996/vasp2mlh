# Run: vasp2mlh_genbasis basis.toml
# Without an argument, use ./POTCAR and write ./basis.h5 (native PAW orbitals).
command = "basis-generate"
[parameters]
potcar = ["POTCAR"]  # paths relative to this file
output = "basis.h5"
# layout = "layout.toml"  # enable compact orbitals with element-specific shells and cutoffs
